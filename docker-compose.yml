services:
  minecraft:
    build: .
    container_name: mc
    ports:
      - "25565:25565"
    volumes:
      - "${MINECRAFT_DATA:-./docker-minecraft-data}:/opt/minecraft"
    # set these in a .env file; see .env.example.
    environment:
      EULA: "${EULA:-false}"
      MINECRAFT_VERSION: "${MINECRAFT_VERSION:-26.3}"
      JAVA_MEMORY: "${JAVA_MEMORY:-2G}"
      OPS: "${OPS:-}"
      OP_LEVEL: "${OP_LEVEL:-4}"
      PAPER_BUILD: "${PAPER_BUILD:-}"
      USE_RECOMMENDED_FLAGS: "${USE_RECOMMENDED_FLAGS:-true}"
      ALLOW_DOWNGRADE: "${ALLOW_DOWNGRADE:-false}"
    stdin_open: true
    tty: true
    restart: "no"
    # the JVM uses well over its heap; keep this about 2G above JAVA_MEMORY.
    mem_limit: "${MEMORY_LIMIT:-4G}"
    # give the server time to finish saving the world before it gets killed
    stop_grace_period: 120s
